<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="VoidJD — Game and App Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1000" height="300" rx="14"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#76B900" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#76B900"/>
      <stop offset="0.6" stop-color="#76B900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip"><rect x="60" y="200" height="40" width="560">
      <animate attributeName="width" dur="6s" repeatCount="indefinite"
        values="0;0;560;560;0" keyTimes="0;0.08;0.55;0.92;1"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="#0a0a0a"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#spot)"/>
    <rect width="6" height="300" fill="#76B900"/>
    <rect y="292" width="1000" height="8" fill="url(#glow)"/>

    <!-- text -->
    <text x="60" y="88" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="15" letter-spacing="4" fill="#76B900">// GAME &amp; APP DEVELOPER</text>
    <text x="56" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Void<tspan fill="#76B900">JD</tspan></text>
    <rect x="60" y="194" width="64" height="4" fill="#76B900"/>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="20">
      <text x="60" y="228" fill="#76B900">&gt;</text>
      <g clip-path="url(#typeclip)">
        <text x="84" y="228" fill="#A3ADA8">Unity  ·  Kotlin  ·  Python  ·  Xray</text>
      </g>
    </g>

    <!-- HUD -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
      <rect x="690" y="55" width="260" height="190" rx="8" fill="#0f1409" stroke="#76B900" stroke-opacity="0.45"/>
      <text x="710" y="85" font-size="12" letter-spacing="2" fill="#7d8a83">FPS</text>
      <text x="710" y="132" font-size="46" font-weight="700" fill="#76B900">240</text>
      <text x="830" y="85" font-size="12" letter-spacing="2" fill="#7d8a83">PING</text>
      <text x="830" y="132" font-size="46" font-weight="700" fill="#FFFFFF">8<tspan font-size="20" fill="#7d8a83">ms</tspan></text>
      <line x1="710" y1="150" x2="930" y2="150" stroke="#76B900" stroke-opacity="0.2"/>
      <polyline points="710,215 730,205 750,218 770,196 790,210 810,200 830,222 850,192 870,208 890,198 910,214 930,202"
        fill="none" stroke="#76B900" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="400" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" dur="3s" values="400;0;0;400" keyTimes="0;0.5;0.9;1" repeatCount="indefinite"/>
      </polyline>
      <circle cx="930" cy="70" r="4" fill="#76B900">
        <animate attributeName="opacity" dur="1.6s" values="1;0.2;1" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
