<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="RayBox — self-hosted networking stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="r"><rect width="900" height="170" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
    <rect width="900" height="170" fill="#0d0d0d"/>
    <rect width="5" height="170" fill="#76B900"/>
    <rect x="0.5" y="0.5" width="899" height="169" rx="12" fill="none" stroke="#76B900" stroke-opacity="0.35"/>
    <text x="36" y="56" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Ray<tspan fill="#76B900">Box</tspan></text>
    <rect x="736" y="32" width="136" height="26" rx="13" fill="#76B900" fill-opacity="0.12" stroke="#76B900" stroke-opacity="0.6"/>
    <circle cx="755" cy="45" r="4" fill="#76B900"><animate attributeName="opacity" dur="1.6s" values="1;0.2;1" repeatCount="indefinite"/></circle>
    <text x="767" y="49.5" font-size="11" letter-spacing="1.5" fill="#76B900">IN DEV</text>
    <text x="36" y="92" font-size="15" fill="#B4BDB8">Self-hosted networking stack. VLESS/Reality on the edge,</text>
    <text x="36" y="114" font-size="15" fill="#B4BDB8">Python automation behind it. Stable, fast, easy to manage.</text>
    <g font-size="12" fill="#76B900">
      <rect x="36" y="132" width="62" height="24" rx="4" fill="#76B900" fill-opacity="0.1"/><text x="48" y="148">Xray</text>
      <rect x="106" y="132" width="76" height="24" rx="4" fill="#76B900" fill-opacity="0.1"/><text x="118" y="148">VLESS</text>
      <rect x="190" y="132" width="88" height="24" rx="4" fill="#76B900" fill-opacity="0.1"/><text x="202" y="148">Reality</text>
      <rect x="286" y="132" width="76" height="24" rx="4" fill="#76B900" fill-opacity="0.1"/><text x="298" y="148">Python</text>
      <rect x="370" y="132" width="76" height="24" rx="4" fill="#76B900" fill-opacity="0.1"/><text x="382" y="148">Docker</text>
    </g>
  </g>
